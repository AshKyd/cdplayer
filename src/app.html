<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Until the theme loads: follow the OS, so the title bar doesn't start light -->
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
        /* Matches akui's default `--akui-bg`, so the webview is never white while the theme loads */
        background: oklch(0.995 0.004 263);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: oklch(0.17 0.012 263);
        }
      }
    </style>
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
